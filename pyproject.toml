[project]
name = "argus"
version = "0.1.0"
description = "A job aggregator built on companies, the boards that reach them, and the postings they carry."
readme = "README.md"
requires-python = ">=3.11"

# The pipeline has exactly one runtime dependency. Scheduling is GitHub Actions,
# storage is stdlib sqlite3 or psycopg, and every parser is the URL router --
# so polling 8,000 boards needs nothing but an HTTP client.
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# The orchestrator only. The pipeline -- discover, poll, notify -- still needs
# nothing but requests, so a runner that only polls installs nothing extra.
orchestrator = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
]
api = ["fastapi>=0.115", "psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # FastAPI's Depends() in defaults is idiomatic
  "SIM108", # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.isort]
known-first-party = ["argus"]
