name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # dev for the test runner, orchestrator for langgraph: CI must exercise
      # what ships. The pipeline itself still needs neither -- a test asserts
      # the feed lane never imports either one.
      - run: pip install -e '.[dev,orchestrator]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
